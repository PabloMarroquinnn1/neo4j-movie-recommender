services:
  neo4j:
    image: neo4j:5.18
    container_name: neo4j-peliculas
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/peliculas123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./data:/var/lib/neo4j/import
    networks:
      - neo4j_net

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  neo4j_net:
    driver: bridge